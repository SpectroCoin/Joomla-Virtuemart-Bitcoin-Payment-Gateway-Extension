name: Checkout journey

# Walks a real shopper through a real VirtueMart checkout: product -> cart ->
# shopper details -> shipment -> payment -> check out -> land on the
# SpectroCoin payment page.
#
# Tier 2 seeds the SpectroCoin order directly on the stub and delivers
# callbacks onto a VirtueMart order it inserted by hand, which proves the
# callback contract but never that a shopper can reach the gateway in the
# first place. plgVmConfirmedOrder assembles the real order from a cart built
# up over several checkout steps in the shopper's session, so "is the plugin
# offered and does checking out redirect" is a genuinely different question
# from "does the callback contract work".
on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  tier3:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run the checkout journey
        run: ./tests/e2e/tier3/tier3.sh

      - name: Screenshots of any failing step
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tier3-screenshots
          path: tests/e2e/tier3/artifacts/
          if-no-files-found: ignore

      - name: Container logs on failure
        if: failure()
        run: cd tests/e2e/tier3 && docker compose logs --tail=150 || true
