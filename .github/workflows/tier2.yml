name: End-to-end

# Installs VirtueMart, puts a real order through the plugin, and delivers a
# callback for every status on the wire, asserting what the shop does with each.
#
# The SpectroCoin API is stood in for by a stub answering as spectrocoin.com
# inside the compose network, so no credentials are needed and no request ever
# reaches the real API. VirtueMart itself is a free download, fetched at run
# time and cached.
on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  tier2:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run the end-to-end test
        run: ./tests/e2e/tier2/tier2.sh

      - name: Container logs on failure
        if: failure()
        run: cd tests/e2e/tier2 && docker compose logs --tail=150 || true
